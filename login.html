<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in / Sign up — SubReady Ontario</title>
<link rel="stylesheet" href="assets/style.css"></head>
<body><div class="wrap">
<header class="site"><a class="logo" href="index.html">SubReady Ontario</a>
<nav><a href="order.html">Order</a><a href="dashboard.html">Dashboard</a></nav></header>

<div id="mode-banner" class="banner" style="display:none"></div>

<div class="card">
<h1 style="font-size:1.5rem">Log in or create an account</h1>
<form id="auth-form">
<label for="name">Full name (new accounts)</label>
<input id="name" autocomplete="name">
<label for="company">GC company (new accounts)</label>
<input id="company" autocomplete="organization">
<label for="email">Email</label>
<input id="email" type="email" required autocomplete="email">
<label for="password">Password</label>
<input id="password" type="password" required autocomplete="current-password">
<p><button class="cta" type="submit" id="signin-btn">Log in</button>
<button class="cta secondary" type="button" id="signup-btn">Create account</button></p>
<p id="auth-msg" class="fine"></p>
</form>
</div>
<p class="fine">One account per customer. Your submissions are visible only to you (enforced by database row-level security once live).</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
var form = document.getElementById("auth-form"), msg = document.getElementById("auth-msg");
function show(t){ msg.textContent = t; }
form.addEventListener("submit", async function(e){
  e.preventDefault();
  var r = await Platform.signIn(document.getElementById("email").value, document.getElementById("password").value);
  if (r.error) { show(r.error.message); } else { window.location.href = "dashboard.html"; }
});
document.getElementById("signup-btn").addEventListener("click", async function(){
  var email = document.getElementById("email").value, pw = document.getElementById("password").value;
  if (!email || !pw) { show("Enter an email and password first."); return; }
  var r = await Platform.signUp(email, pw, {
    full_name: document.getElementById("name").value,
    company: document.getElementById("company").value
  });
  if (r.error) { show(r.error.message); return; }
  show(Platform.supabaseReady
    ? "Account created. If email confirmation is on, confirm via your inbox, then log in."
    : "Saved (preview mode). Continue to your dashboard.");
  setTimeout(function(){ window.location.href = "dashboard.html"; }, 900);
});
</script>
</body></html>
